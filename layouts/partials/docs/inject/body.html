<div class="book-theme-inline">
  <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
    <span class="theme-toggle-label">dark</span>
  </button>
</div>

<link href="{{ "pagefind/pagefind-ui.css" | relURL }}" rel="stylesheet">
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>

<div id="pagefind-search-container"></div>

<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        // Move theme toggle above the first header in the TOC for glossary content
        const themeToggle = document.querySelector('.book-theme-inline');
        const tocContent = document.querySelector('.book-toc-content');
        const mainContent = document.querySelector('.book-page');

        if (themeToggle && tocContent && mainContent) {
            // Insert the theme toggle before the TOC's heading list
            tocContent.insertBefore(themeToggle, tocContent.firstChild);
            // Add a class for styling
            themeToggle.classList.add('book-theme-inline-toc');
        }
        
        // Move search container
        const searchContainer = document.getElementById('pagefind-search-container');
        if (mainContent && searchContainer) {
            const header = mainContent.querySelector('.book-header');
            if (header) {
                header.insertAdjacentElement('afterend', searchContainer);
            } else {
                mainContent.insertBefore(searchContainer, mainContent.firstChild);
            }
        }
        
        new PagefindUI({ 
            element: "#pagefind-search-container", 
            showSubResults: true
        });

        // Function to apply orange highlight to mark elements
        function applyOrangeHighlight() {
            // Try multiple selectors to catch all possible mark elements
            const selectors = [
                '#pagefind-search-container mark.pagefind-search-term',
                '.pagefind-ui mark.pagefind-search-term',
                'mark.pagefind-search-term'
            ];
            
            const highlightColor = '#FA8128';
            
            selectors.forEach(selector => {
                const marks = document.querySelectorAll(selector);
                marks.forEach(mark => {
                    mark.style.cssText = `background-color: ${highlightColor} !important; background: ${highlightColor} !important; color: #000000 !important;`;
                });
            });
        }

        // Apply immediately to any existing marks
        applyOrangeHighlight();

        // Set up a MutationObserver to watch for new mark elements
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.type === 'childList') {
                    applyOrangeHighlight();
                }
            });
        });

        // Start observing the search container for changes
        observer.observe(searchContainer, {
            childList: true,
            subtree: true
        });
    });
</script>
