<div class="book-theme-inline">
  <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">☾</span>
    <span class="theme-toggle-label">dark</span>
  </button>
</div>

<link href="/pagefind/pagefind-ui.css" rel="stylesheet">
<script src="/pagefind/pagefind-ui.js"></script>

<div id="pagefind-search-container"></div>

<script>
    window.addEventListener('DOMContentLoaded', (event) => {
        const searchContainer = document.getElementById('pagefind-search-container');
        const mainContent = document.querySelector('.book-page');
        if (mainContent && searchContainer) {
            const header = mainContent.querySelector('.book-header');
            if (header) {
                header.insertAdjacentElement('afterend', searchContainer);
            } else {
                mainContent.insertBefore(searchContainer, mainContent.firstChild);
            }
        }
        
        new PagefindUI({ element: "#pagefind-search-container", showSubResults: true });
    });
</script>
