<!--
  This file must stay at layouts/index.html (or layouts/home.html).
  Hugo only routes here for the site's homepage from this exact path.
  Moving it to layouts/<section>/list.html (e.g. layouts/docs/list.html)
  silently detaches it: Hugo falls back to the hugo-book theme's default
  homepage template instead, which renders the book nav panel/ToC and
  drops this hero layout with no build error or warning.
-->
<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ .Description | default .Site.Params.BookDescription }}">
  <title>{{ .Title }} | {{ .Site.Title }}</title>
  
  <!-- Open Sauce Font -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/open-sauce-one">
  <link rel="stylesheet" href="{{ "custom.css" | relURL }}?v=3">
  <script src="{{ "theme-toggle.js" | relURL }}"></script>
  
  <style>
    /* Hide the book theme structure on homepage */
    .book-menu,
    .book-header,
    .book-toc {
      display: none !important;
    }
    
    .book-page {
      padding: 0 !important;
      max-width: 100% !important;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Open Sauce One', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--cream-bg) !important;
      color: var(--dark-text);
      overflow-x: hidden;
    }

    .hero-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-color: var(--cream-bg);
      position: relative;
    }

    .logo-container {
      width: 100%;
      max-width: 60vw;
      animation: fadeIn 1s ease-in;
    }

    .logo-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer {
      position: absolute;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--dark-text);
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .logo-container {
        max-width: 85vw;
      }

      .footer {
        bottom: 1rem;
        font-size: 0.8rem;
      }
    }

    @media (max-width: 480px) {
      .logo-container {
        max-width: 95vw;
      }
    }

    /* Footer link styling */
    .footer a {
      color: var(--accent-link);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    
    .footer a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="hero-container">
    <div class="logo-container">
      <a href="{{ "quick-reference" | relURL }}" aria-label="Explore the Agent Ecosystem Glossary">
        <img src="{{ "assets/aeg-logo.png" | relURL }}"
             alt="Agent Ecosystem Glossary"
             data-light-src="{{ "assets/aeg-logo.png" | relURL }}"
             data-dark-src="{{ "assets/aeg-logo-dark-mode.png" | relURL }}">
      </a>
    </div>
    
    <footer class="footer">
      <div class="home-footer">
        <span>© {{ now.Year }} Rhyannon Rodriguez • <a href="https://github.com/rhyannonjoy/agent-ecosystem-glossary">GitHub ↗</a></span>
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          <span class="theme-toggle-label">dark</span>
        </button>
      </div>
    </footer>
  </div>
</body>
