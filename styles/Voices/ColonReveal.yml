extends: script
message: "Colon reveal: '%s'. Rewrite as a plain sentence."
level: warning
scope: raw
script: |
  text := import("text")
  matches := []
  
  lines := text.split(scope, "\n")
  in_code_block := false
  
  for line in lines {
    trimmed := text.trim_space(line)
    
    if trimmed == "" {
      continue
    }
    
    if text.has_prefix(trimmed, "```") {
      in_code_block = !in_code_block
      continue
    }
    
    if in_code_block {
      continue
    }
    
    // Skip table rows
    if text.contains(line, "|") {
      continue
    }
    
    // Skip headings
    if text.has_prefix(trimmed, "#") {
      continue
    }
    
    // Skip bold terms
    if text.has_prefix(trimmed, "**") {
      continue
    }
    
    // Skip admonitions
    if text.re_match("^(Note|Tip|Warning|Caution|Important|Example|Related|See also|TODO|Update|Requirements?|Default|Usage)\\b", line) {
      continue
    }
    
    // Test: line starts with capital letter, has colon, continues with lowercase
    if text.re_match("^[A-Z].*: [a-z]", line) {
       start := text.index(scope, line)
       matches = append(matches, {begin: start, end: start + len(line)})
    }
  }
